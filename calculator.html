<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Calculator - SwasthyaSalah</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-50"><header class="bg-white shadow p-4"><a href="index.html" class="font-bold text-[#0e4a8a]">SwasthyaSalah</a></header>
<div class="max-w-xl mx-auto bg-white p-6 mt-6 rounded-xl shadow">
<h1 class="text-2xl font-bold">BMI Calculator</h1>
<input id="h" type="number" placeholder="Height cm me" class="border w-full p-2 mt-3 rounded"><input id="w" type="number" placeholder="Weight kg me" class="border w-full p-2 mt-3 rounded">
<button onclick="calc()" class="bg-green-600 text-white w-full p-2 mt-3 rounded">Calculate</button><p id="res" class="font-bold mt-3"></p>
</div>
<script>function calc(){let h=document.getElementById('h').value/100;let w=document.getElementById('w').value;let bmi=(w/(h*h)).toFixed(2);document.getElementById('res').innerText="Aapka BMI hai: "+bmi;}</script>
</body></html>
