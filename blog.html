<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Blog - SwasthyaSalah</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-50"><header class="bg-white shadow p-4 flex justify-between"><a href="index.html" class="font-bold text-xl text-[#0e4a8a]">SwasthyaSalah</a><a href="index.html">Home</a></header>
