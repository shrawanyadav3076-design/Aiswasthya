<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Doctor</title>
<style>body{font-family:sans-serif;background:#f0fdfa;margin:0}.box{max-width:700px;margin:15px auto;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 15px #0002}.h{background:#0d9488;color:#fff;padding:15px;text-align:center;font-size:20px;font-weight:bold}.m{height:500px;overflow:auto;padding:15px;display:flex;flex-direction:column}.msg{padding:12px 15px;border-radius:12px;margin:8px 0;max-width:85%;line-height:1.6}.u{background:#0d9488;color:#fff;align-self:flex-end}.a{background:#e0f2fe;color:#0c4a6e;align-self:flex-start;white-space:pre-line}.i{display:flex;padding:12px;gap:8px;border-top:1px solid #ddd}.i input{flex:1;padding:12px;border:2px solid #0d9488;border-radius:8px}.i button{background:#0d9488;color:#fff;border:0;padding:12px 20px;border-radius:8px}</style></head><body>
<div class="box"><div class="h">🤖 AI डॉक्टर</div><div class="m" id="msgs"><div class="msg a">नमस्ते! पेट दर्द, बुखार कुछ भी पूछिए।</div></div>
<div class="i"><input id="inp" placeholder="सवाल लिखें..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">भेजें</button></div></div>
<script>
const API_KEY = "AQ.Ab8RNGJMNTbYSZ6hbQpZbMG8U1TkIVLJ6qpEeoAKVODMFLI2Qg";
async function send(){
let t=document.getElementById('inp').value.trim();if(!t)return;
let box=document.getElementById('msgs');box.innerHTML+=`<div class="msg u">${t}</div>`;document.getElementById('inp').value='';
let id='a'+Date.now();box.innerHTML+=`<div class="msg a" id="${id}">⏳...</div>`;box.scrollTop=box.scrollHeight;
try{
let r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent",{
method:"POST",
headers:{"Content-Type":"application/json","x-goog-api-key":API_KEY},
body:JSON.stringify({contents:[{parts:[{text:"You are helpful doctor for village people, answer in Hindi simple: "+t}]}]})
});
let d=await r.json();
if(d.error) throw new Error(d.error.message);
document.getElementById(id).innerText=d.candidates[0].content.parts[0].text;
}catch(e){document.getElementById(id).innerText="Error: "+e.message}
box.scrollTop=box.scrollHeight;
}
</script></body></html>
