<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Doctor</title>
<style>body{font-family:sans-serif;background:#f0fdfa;margin:0}.box{max-width:700px;margin:15px auto;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 15px #0002}.h{background:#0d9488;color:#fff;padding:15px;text-align:center;font-size:20px;font-weight:bold}.m{height:500px;overflow:auto;padding:15px;display:flex;flex-direction:column;background:#fafffe}.msg{padding:12px 15px;border-radius:12px;margin:8px 0;max-width:85%;line-height:1.6}.u{background:#0d9488;color:#fff;align-self:flex-end}.a{background:#e0f2fe;color:#0c4a6e;align-self:flex-start;white-space:pre-line}.i{display:flex;padding:12px;gap:8px;border-top:1px solid #ddd}.i input{flex:1;padding:12px;border:2px solid #0d9488;border-radius:8px}.i button{background:#0d9488;color:#fff;border:0;padding:12px 20px;border-radius:8px;font-weight:bold}</style></head><body>
<div class="box"><div class="h">🤖 AI डॉक्टर - AI Swasthya</div><div class="m" id="msgs"><div class="msg a">नमस्ते! मैं AI डॉक्टर हूँ। पेट दर्द, बुखार, सर्दी कुछ भी पूछिए।</div></div>
<div class="i"><input id="inp" placeholder="सवाल लिखें..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">भेजें</button></div></div>
<script>
const API_KEY = "AQ.Ab8RNGJMNTbYSZ6hbQpZbMG8U1TkIVLJ6qpEeoAKVODMFLI2Qg";
async function send(){
let inp=document.getElementById('inp');let t=inp.value.trim();if(!t)return;
let m=document.getElementById('msgs');m.innerHTML+=`<div class="msg u">${t}</div>`;inp.value='';
let id='x'+Date.now();m.innerHTML+=`<div class="msg a" id="${id}">⏳ सोच रहा हूँ...</div>`;m.scrollTop=m.scrollHeight;
try{
let res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`,{
method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({contents:[{parts:[{text:`You are AI doctor for rural India. Answer in Hindi, simple 5 lines, give home remedies and when to see doctor. Question: ${t}`}]}]})});
let d=await res.json();
if(d.error) throw new Error(d.error.message);
document.getElementById(id).innerText=d.candidates[0].content.parts[0].text;
}catch(e){document.getElementById(id).innerText="Error: "+e.message;}
m.scrollTop=m.scrollHeight;
}
</script></body></html>
