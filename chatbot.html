<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI डॉक्टर - AI Swasthya</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
body{font-family:'Poppins',sans-serif;background:#f0fdfa;margin:0}
.box{max-width:720px;margin:20px auto;background:white;border-radius:15px;box-shadow:0 5px 25px rgba(0,0,0,0.1);overflow:hidden}
.header{background:#0d9488;color:white;padding:18px;text-align:center;font-size:22px;font-weight:600}
.msgs{height:480px;overflow-y:auto;padding:20px;background:#f8fffe;display:flex;flex-direction:column}
.msg{margin:10px 0;padding:12px 18px;border-radius:14px;max-width:85%;line-height:1.7;white-space:pre-line}
.user{background:#0d9488;color:white;align-self:flex-end}
.ai{background:#e0f2fe;color:#0c4a6e;align-self:flex-start}
.input{display:flex;padding:15px;border-top:1px solid #e5e7eb;background:white;gap:10px}
.input input{flex:1;padding:12px;border:2px solid #0d9488;border-radius:10px;font-size:16px;outline:none}
.input button{background:#0d9488;color:white;border:none;padding:12px 28px;border-radius:10px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="box">
<div class="header">🤖 AI डॉक्टर - AI Swasthya</div>
<div class="msgs" id="msgs">
<div class="msg ai">नमस्ते! मैं आपका AI डॉक्टर हूँ। 🙏

पेट दर्द, बुखार, सर्दी, खाँसी - कुछ भी पूछिए, मैं हिंदी में आसान घरेलू उपाय बताऊँगा।</div>
</div>
<div class="input">
<input id="inp" placeholder="जैसे: पेट दर्द का इलाज बताओ?" onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">भेजें</button>
</div>
</div>

<script>
const API_KEY = "AQ.Ab8RN6L1IvE3INB6G_DFHhXpGXm53q1oRdhEOdr-m1n8nmlNMQ";

async function send(){
let inp=document.getElementById('inp');
let txt=inp.value.trim();
if(!txt) return;
let box=document.getElementById('msgs');
box.innerHTML+=`<div class="msg user">${txt}</div>`;
inp.value='';
let id='a'+Date.now();
box.innerHTML+=`<div class="msg ai" id="${id}">⏳ AI डॉक्टर सोच रहा है...</div>`;
box.scrollTop=box.scrollHeight;

try{
let res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
contents:[{parts:[{text:`You are a helpful rural Indian AI doctor. User speaks Hindi. Give answer in simple Hindi. Use 5-6 short points, 2 home remedies, food advice, and when to visit doctor. Add disclaimer: Ye jankari ke liye hai, gambhir hone par doctor se milen. Question: ${txt}`}]}]
})
});
let data=await res.json();
console.log(data);
if(data.error) throw new Error(data.error.message);
let ans=data.candidates[0].content.parts[0].text;
document.getElementById(id).innerText=ans;
}catch(e){
document.getElementById(id).innerText="❌ Error: "+e.message+"\n\nAgar phir bhi error aaye to aistudio.google.com se nayi key banao.";
}
box.scrollTop=box.scrollHeight;
}
</script>
</body>
</html>
